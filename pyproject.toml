[project]
name = "documind-ai"
version = "0.1.0"
description = "Agentic RAG document assistant with OpenAI and Groq"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.17.3",
    "ipykernel>=7.2.0",
    "langchain>=1.3.15",
    "langchain-openai>=1.4.3",
    "langchain-groq>=1.1.3",
    "numexpr>=2.14.1",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
]
